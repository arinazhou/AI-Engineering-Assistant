[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eng-assistant"
version = "0.1.0"
description = "LLM-powered engineering assistant with RAG over software repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "faiss-cpu>=1.8.0",
  "tiktoken>=0.7.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "streamlit>=1.37.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
]

[project.scripts]
ai-eng = "ai_eng_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
